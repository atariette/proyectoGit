name: validate-dev
on:
  push:
    branches:
      - main
jobs:
  probar:
    runs-on: self-hosted
    steps:
      - name: update-readme
        env:
          TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          if ($env:TOKEN -eq $env:LOCAL_PROD_TOKEN) {
              Write-Host "Coinciden "
              echo "AppVersion-1" >> proyectoGit\README.md
          } else {
              Write-Host "No coinciden "
              exit 1
          }
