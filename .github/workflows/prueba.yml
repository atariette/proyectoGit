name: Prueba runner y secret
on: [push]
jobs:
    probar:
        runs-on: self-hosted
        steps:
            - name: Comparar secret con variable local
              env:
                  TOKEN: ${{ secrets.DEV_TOKEN }}
              run: |
                  Write-Host "Valor Nube: '$env:TOKEN'"
                  Write-Host "Valor Local: '$env:LOCAL_DEV_TOKEN'"
                    if ($env:TOKEN -eq $env:LOCAL_DEV_TOKEN) {
                        Write-Host "Coinciden "
                    } else {
                        Write-Host "No coinciden "
                        exit 1
                    }
